[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen"
version = "0.2.0"
description = "Proof of physical presence for live video, by measurement rather than appearance"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11,<1.16",  # see requirements.txt
    "opencv-contrib-python>=4.8",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "cryptography>=42",
    "mss>=9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
experiments = ["matplotlib>=3.8", "av==12.3.0"]  # av: see requirements.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
